name: Postgres Chaos Monkey

on:
  schedule:
    # Trigger the workflow every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows running manually

jobs:
  chaos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Roll the Dice (1-in-24 chance)
        id: dice
        run: |
          # Generate a random number between 0 and 23
          ROLL=$((RANDOM % 24))
          if [ $ROLL -lt 12 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "The Chaos Monkey has woken up! (Rolled $ROLL)"
            echo "strike=true" >> $GITHUB_OUTPUT
          else
            echo "The Chaos Monkey is sleeping. (Rolled $ROLL, needed 0)"
            echo "strike=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.dice.outputs.strike == 'true'
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        if: steps.dice.outputs.strike == 'true'
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run Chaos Monkey
        if: steps.dice.outputs.strike == 'true'
        run: cargo run --release
        working-directory: ./pg-chaos-monkey # Adjust this to your project root if you move the code
        env:
          # In your github repository settings, add this secret
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
